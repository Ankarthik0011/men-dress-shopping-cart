<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Men's Dress Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>Men's Dress Store</h1>
    <p>Premium Fashion for Men</p>
</header>

<section class="products">
    <div class="product">
        <h3>Formal Shirt</h3>
        <p>₹999</p>
        <button onclick="addToCart('Formal Shirt', 999)">Add to Cart</button>
    </div>
    <div class="product">
        <h3>Casual T-Shirt</h3>
        <p>₹699</p>
        <button onclick="addToCart('Casual T-Shirt', 699)">Add to Cart</button>
    </div>
    <div class="product">
        <h3>Denim Jeans</h3>
        <p>₹1499</p>
        <button onclick="addToCart('Denim Jeans', 1499)">Add to Cart</button>
    </div>
</section>

<section class="cart">
    <h2>Shopping Cart</h2>
    <ul id="cart-items"></ul>
    <h3>Total: ₹<span id="total">0</span></h3>
</section>

<script src="js/cart.js"></script>
</body>
</html>
